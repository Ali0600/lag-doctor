[project]
name = "lag-doctor"
version = "0.1.0"
description = "Finds out why a PC game is lagging by watching it from outside, and fixes what can be fixed safely."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# None at run time: lagdoctor/ imports only the standard-library modules the installer's embeddable Python imports
# (tests/test_stdlib_only.py; scripts/runtime_modules.json), and that Python holds no other package.
dependencies = []

[project.scripts]
lagdoctor = "lagdoctor.cli:main"

# Groups stay out of the wheel's metadata. `uv sync` installs dev; `--group laglab` adds LagLab's.
[dependency-groups]
# psutil is the tests' independent readout of what lagdoctor/winapi/ reads.
dev = ["pytest>=8", "psutil>=7.0"]
# Only the synthetic test game, laglab/ (not in the wheel), needs a graphics library.
laglab = ["pyglet>=2.1"]

[build-system]
# The same minor version as the uv that CI pins (ci.yml), so uv builds with the copy of uv_build it carries.
requires = ["uv_build>=0.10.4,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The wheel holds the lagdoctor package only: laglab/, tests/, scripts/ and docs/ stay in the checkout.
module-name = "lagdoctor"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
